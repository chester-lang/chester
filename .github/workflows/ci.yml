name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Build and Test
      run: nix develop --command sh -c "coq_makefile -f _CoqProject -o Makefile && make && dune build && dune runtest"

  bootstrap:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Nix-build Go self-host (stage1 → stage2 + smoke)
      run: nix build .#default --print-build-logs
